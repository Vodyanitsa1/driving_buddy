name: driving_buddy
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.12.1
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1
  audioplayers: ^5.2.1
  supabase_flutter: ^2.5.0
  share_plus: ^10.0.0
  google_mlkit_face_mesh_detection: ^0.3.0
  google_mlkit_commons: ^0.9.0
  wakelock_plus: ^1.2.10
  image_picker: ^1.2.4
  http: ^1.2.1
  geolocator: ^12.0.0
  url_launcher: ^6.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/face_landmark.tflite
    - assets/images/meme_tidur.png
    - assets/audio/alarm.mp3
    - assets/sounds/alarm.mp3
    - assets/sounds/beep.wav
    - assets/sounds/buzzer.wav
    - places_snapshot.json
